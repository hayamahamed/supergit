name: Package the packages. 

on:
  push:
    tags:
      - "*-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NFPM_VERSION: "2.47.0"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive package from tag
        run: echo "PKG=${GITHUB_REF_NAME%-v*}" >> "$GITHUB_ENV"

      - uses: extractions/setup-just@v3

      - name: Install nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/nfpm.deb

      - name: Write signing key
        env:
          PRIVATE_ASC: ${{ secrets.PRIVATE_ASC }}
        run: |
          test -n "$PRIVATE_ASC" || { echo "secret PRIVATE_ASC is not set"; exit 1; }
          umask 077
          printf '%s\n' "$PRIVATE_ASC" > private.asc

      - name: Build
        env:
          NFPM_PASSPHRASE: ${{ secrets.NFPM_PASSPHRASE }}
        run: just

      - name: Remove signing key
        if: always()
        run: rm -f private.asc

      - name: Check output
        run: ls -l "dist/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}-dist
          path: dist/*

      - name: Versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/*" \
            --title "${PKG} ${GITHUB_REF_NAME#${PKG}-v}" \
            --latest=false

      - name: Rolling release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${PKG}-latest" --cleanup-tag --yes || true
          gh release create "${PKG}-latest" "dist/*" \
            --target "$GITHUB_SHA" \
            --title "${PKG} (latest: ${GITHUB_REF_NAME#${PKG}-v})" \
            --latest=false
            
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#${PKG}-v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          SHA="$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)"
          echo "version=$VERSION sha=$SHA"

          umask 077
          printf '%s\n' "$TAP_DEPLOY_KEY" > /tmp/tap_key
          export GIT_SSH_COMMAND="ssh -i /tmp/tap_key -o StrictHostKeyChecking=accept-new"

          git clone git@github.com:hayamahamed/homebrew-tap.git /tmp/tap
          cd /tmp/tap

          FORMULA="Formula/${PKG}.rb"
          test -f "$FORMULA" || { echo "no formula for $PKG, skipping"; exit 0; }

          sed -i -E \
            -e "s|^(\s*url \").*(\")|\1${URL}\2|" \
            -e "s|^(\s*sha256 \").*(\")|\1${SHA}\2|" \
            "$FORMULA"

          if git diff --quiet; then
            echo "formula already up to date"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "${PKG} ${VERSION}"

          for i in 1 2 3; do
            git push && break
            git pull --rebase
          done

      - name: Remove tap key
        if: always()
        run: rm -f /tmp/tap_key
